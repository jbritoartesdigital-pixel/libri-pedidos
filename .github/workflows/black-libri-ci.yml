name: Verificar Black Libri sem publicar

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/v2-black-libri*.js'
      - 'src/routes/*black-libri*.js'
      - 'src/routes/public-v2.js'
      - 'src/index.js'
      - 'public/js/*black-libri*.js'
      - 'public/css/*black-libri*.css'
      - 'public/js/admin-v2.js'
      - 'public/js/admin-v2-config.js'
      - 'public/js/admin-v2-find.js'
      - 'public/js/client-v2.js'
      - 'public/js/client-v2-store.js'
      - 'public/admin-v2.html'
      - 'public/client-v2.html'
      - 'migrations/0029_black_libri.sql'
      - 'migrations/0030_black_libri_admin.sql'
      - 'migrations/0031_black_libri_dates.sql'
      - 'migrations/0032_black_libri_20pct.sql'
      - 'tests/*black-libri*.test.mjs'
      - 'tests/v2.test.mjs'
      - 'tests/admin-v2-navigation.test.mjs'
      - '.github/workflows/black-libri-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-black-libri:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Conferir sintaxe e rotas
        run: npm run check
      - name: Testar todos os fluxos do aplicativo
        run: npm test
      - name: Validar banco SQLite a partir das migrations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3
          db=sqlite3.connect(':memory:')
          for file in sorted(Path('migrations').glob('*.sql')):
              print('Aplicando',file.name)
              db.executescript(file.read_text(encoding='utf-8'))
          prizes=db.execute('select count(*) from v2_black_libri_prizes').fetchone()[0]
          enabled=db.execute('select admin_enabled from v2_black_libri_campaign_state where id=1').fetchone()[0]
          assert prizes==20, f'Esperados 20 prêmios, encontrado: {prizes}'
          assert enabled==0, 'Campanha jamais pode começar habilitada'
          rare=db.execute("SELECT kind,value,weight,max_claims,enabled FROM v2_black_libri_prizes WHERE code='off_20p'").fetchone()
          assert rare==('percent',20,1,3,0), f'Prêmio raro fora da configuração aprovada: {rare}'
          print('OK: 20 prêmios; 20% raro com 3 unidades e desativado por padrão')
          PY
      - name: Validar empacotamento, sem deploy
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/black-libri-check
        env:
          WRANGLER_SEND_METRICS: 'false'
