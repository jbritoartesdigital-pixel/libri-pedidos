name: Publicação única - Diagnóstico libri-pedidos
on:
  pull_request:
    paths:
      - '.github/workflows/deploy-diagnostico-uma-vez.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-diagnostico-uma-vez.yml'
permissions:
  contents: read
concurrency:
  group: deploy-diagnostico-libri-pedidos
  cancel-in-progress: false
jobs:
  validar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Instalar sem alterações
        run: pnpm install --frozen-lockfile
      - name: Checagens e testes do V2
        run: |
          pnpm run check
          pnpm test
      - name: Build sem publicação
        run: pnpm exec wrangler deploy --dry-run --outdir /tmp/diag-dry
      - name: Publicar somente em main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
