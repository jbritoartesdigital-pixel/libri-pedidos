name: Inventario temporario D1 Drive Flow (somente leitura)
on:
  push:
    branches: [chore/remover-flow-e-drive-20261030]
    paths:
      - '.github/workflows/inventario-temp-d1-integracoes.yml'
permissions:
  contents: read
jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Conferir credenciais existentes sem exibir valores
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Verificar esquema antigo do D1 sem dados pessoais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          pnpm exec wrangler d1 execute libri-pedidos-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'v2_%drive%' OR name LIKE 'v2_%flow%') ORDER BY name" > /tmp/schema.json 2> /tmp/wrangler-error.txt
          code=$?
          if [ "$code" -ne 0 ]; then
            echo 'A consulta somente leitura falhou. Informações técnicas do Wrangler:'
            sed -n '1,22p' /tmp/wrangler-error.txt
            exit "$code"
          fi
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const raw=JSON.parse(readFileSync('/tmp/schema.json','utf8'));
          const rows=raw?.[0]?.results;
          if(!Array.isArray(rows))throw Error('Estrutura de retorno inesperada');
          for(const x of rows){
            if(!/^v2_[a-z0-9_]+$/.test(x.name))throw Error('Nome de tabela inesperado');
            console.log('Tabela antiga: '+x.name);
          }
          NODE
