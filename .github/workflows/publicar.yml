name: Publicar Portal de Pedidos

on:
  workflow_dispatch:
  # Liberação única: alterações posteriores não fazem deploy por push,
  # a menos que o commit tenha explicitamente o prefixo de release abaixo.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar.yml'

permissions:
  contents: read

concurrency:
  group: libri-pedidos-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release: libri-pedidos-finalizar-20261010')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validar sintaxe JavaScript
        run: npm run check

      - name: Testar fluxos V2 em SQLite
        run: npm test

      # Gate obrigatório antes de acessar R2, D1 ou publicar o Worker.
      # Apenas dados sintéticos. Alterações visuais geram evidências, sem
      # bloquear por diferenças de pixels; falhas funcionais/mobile bloqueiam.
      - name: Preparar Playwright no Chrome preinstalado
        run: |
          # Isola npm para não tocar no node_modules/lockfile mantidos por pnpm.
          npm install --prefix /tmp/libri-browser-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          ln -s /tmp/libri-browser-deps/node_modules/playwright node_modules/playwright
          ln -s /tmp/libri-browser-deps/node_modules/pngjs node_modules/pngjs

      - name: Barrar deploy se o teste Android ou diagnóstico falhar
        run: node tests/etapa2-browser.mjs

      - name: Guardar evidências dos testes no GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libri-etapa2-visual-deploy-${{ github.run_id }}
          path: .artifacts/etapa2/
          retention-days: 7
          if-no-files-found: ignore

      - name: Validar imports relativos JavaScript
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path("src"),
              Path("public/js"),
          ]

          import_pattern = re.compile(
              r"""(?:\bfrom\s*|\bimport\s*\()\s*['"]([.]{1,2}/[^'"]+)['"]"""
          )

          missing = []

          for root in roots:
              if not root.exists():
                  continue

              for path in root.rglob("*"):
                  if not path.is_file() or path.suffix not in {".js", ".mjs"}:
                      continue

                  source = path.read_text(encoding="utf-8")

                  for specifier in import_pattern.findall(source):
                      clean_specifier = (
                          specifier
                          .split("?", 1)[0]
                          .split("#", 1)[0]
                      )

                      target = path.parent / clean_specifier

                      candidates = [target]

                      if not target.suffix:
                          candidates.extend([
                              target.with_suffix(".js"),
                              target.with_suffix(".mjs"),
                              target / "index.js",
                              target / "index.mjs",
                          ])

                      if not any(candidate.exists() for candidate in candidates):
                          missing.append(
                              f"{path}: import ausente -> {specifier}"
                          )

          if missing:
              print("Imports relativos inválidos encontrados:")
              for item in missing:
                  print(f"  - {item}")

              raise SystemExit(
                  f"{len(missing)} import(s) relativo(s) apontam para arquivo inexistente."
              )

          print("✓ Imports relativos JavaScript validados.")
          PY

      - name: Validar migrations e catálogo V2 localmente
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sqlite3

          migration_files = sorted(Path("migrations").glob("*.sql"))

          if not migration_files:
              raise SystemExit("Nenhuma migration encontrada.")

          db = sqlite3.connect(":memory:")

          try:
              for migration in migration_files:
                  print(f"Aplicando localmente: {migration.name}")
                  db.executescript(
                      migration.read_text(encoding="utf-8")
                  )

              products = db.execute(
                  "SELECT COUNT(*) FROM v2_products"
              ).fetchone()[0]

              if products != 7:
                  raise SystemExit(
                      f"Catálogo V2 inválido: "
                      f"esperados 7 produtos, encontrados {products}."
                  )

              terms = db.execute(
                  "SELECT COUNT(*) FROM v2_terms_versions "
                  "WHERE version = '2.0' AND active = 1"
              ).fetchone()[0]

              if terms != 1:
                  raise SystemExit(
                      "Termos 2.0 ativos não encontrados."
                  )

              print("✓ Migrations e núcleo V2 validados.")
          finally:
              db.close()
          PY

      - name: Confirmar acesso seguro ao Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token Cloudflare não configurado"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Conta Cloudflare não configurada"; exit 1; }
          echo "✓ Credenciais Cloudflare disponíveis. Prosseguindo com validação remota."

      - name: Verificar pacote Cloudflare sem publicar
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/release-check
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Garantir bucket R2 privado
        run: |
          if npx wrangler r2 bucket info libri-pedidos-files >/dev/null 2>&1; then
            echo "✓ Bucket libri-pedidos-files já existe."
          else
            echo "Criando bucket privado libri-pedidos-files..."
            npx wrangler r2 bucket create libri-pedidos-files
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ver migrations pendentes no D1
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Criar backup do D1 antes das migrations
        run: |
          npx wrangler d1 export libri-pedidos-db \
            --remote \
            --output=backup-d1-before-deploy.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Nunca anexar SQL de clientes em repositório público.
      # Se houver segredo de backup opcional, anexar SOMENTE versão cifrada.
      - name: Cifrar backup com AES-256 quando chave estiver disponível
        id: d1_backup
        env:
          BACKUP_PASSWORD: ${{ secrets.LIBRI_D1_BACKUP_PASSWORD }}
        run: |
          if [ -n "$BACKUP_PASSWORD" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in backup-d1-before-deploy.sql \
              -out backup-d1-before-deploy.sql.enc \
              -pass env:BACKUP_PASSWORD
            echo "encrypted=true" >> "$GITHUB_OUTPUT"
            echo "✓ Backup cifrado; somente o .enc pode ser armazenado."
          else
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem senha de cifragem: backup local temporário, sem anexo público."
          fi
          rm -f backup-d1-before-deploy.sql

      - name: Guardar somente backup cifrado
        if: ${{ steps.d1_backup.outputs.encrypted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-encriptado-${{ github.run_id }}
          path: backup-d1-before-deploy.sql.enc
          retention-days: 14
          if-no-files-found: error

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir migrations após aplicação
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Os secrets já configurados no Worker são preservados pelo deploy.
      # Não os regravamos aqui para não alterar sessão Admin, Passkey, Push ou Mercado Pago.

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Excluir cópias temporárias do backup
        if: always()
        run: rm -f backup-d1-before-deploy.sql backup-d1-before-deploy.sql.enc

