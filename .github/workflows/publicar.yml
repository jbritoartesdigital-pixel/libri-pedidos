name: Publicar Portal de Pedidos

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install

      - name: Validar sintaxe JavaScript
        run: |
          find src public/js -type f \( -name "*.js" -o -name "*.mjs" \) -print0 \
            | xargs -0 -n1 node --check

      - name: Validar migrations e catálogo V2 localmente
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sqlite3

          migration_files = sorted(Path("migrations").glob("*.sql"))

          if not migration_files:
              raise SystemExit("Nenhuma migration encontrada.")

          db = sqlite3.connect(":memory:")

          try:
              for migration in migration_files:
                  print(f"Aplicando localmente: {migration.name}")
                  db.executescript(migration.read_text(encoding="utf-8"))

              products = db.execute(
                  "SELECT COUNT(*) FROM v2_products"
              ).fetchone()[0]

              if products != 7:
                  raise SystemExit(
                      f"Catálogo V2 inválido: esperados 7 produtos, encontrados {products}."
                  )

              terms = db.execute(
                  "SELECT COUNT(*) FROM v2_terms_versions "
                  "WHERE version = '2.0' AND active = 1"
              ).fetchone()[0]

              if terms != 1:
                  raise SystemExit("Termos 2.0 ativos não encontrados.")

              print("✓ Migrations e núcleo V2 validados.")
          finally:
              db.close()
          PY

      - name: Ver migrations pendentes no D1
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Criar backup do D1 antes das migrations
        run: |
          npx wrangler d1 export libri-pedidos-db \
            --remote \
            --output=backup-d1-before-deploy.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guardar backup do D1
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-before-deploy
          path: backup-d1-before-deploy.sql
          retention-days: 14

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir migrations após aplicação
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Sincronizar segredo Mercado Pago Access Token
        run: |
          if [ -n "$MERCADO_PAGO_ACCESS_TOKEN" ]; then
            printf '%s' "$MERCADO_PAGO_ACCESS_TOKEN" \
              | npx wrangler secret put MERCADO_PAGO_ACCESS_TOKEN
          else
            echo "::warning::MERCADO_PAGO_ACCESS_TOKEN ainda não foi cadastrado nos Secrets do GitHub."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCADO_PAGO_ACCESS_TOKEN: ${{ secrets.MERCADO_PAGO_ACCESS_TOKEN }}

      - name: Sincronizar segredo do Webhook Mercado Pago
        run: |
          if [ -n "$MERCADO_PAGO_WEBHOOK_SECRET" ]; then
            printf '%s' "$MERCADO_PAGO_WEBHOOK_SECRET" \
              | npx wrangler secret put MERCADO_PAGO_WEBHOOK_SECRET
          else
            echo "::warning::MERCADO_PAGO_WEBHOOK_SECRET ainda não foi cadastrado nos Secrets do GitHub."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MERCADO_PAGO_WEBHOOK_SECRET: ${{ secrets.MERCADO_PAGO_WEBHOOK_SECRET }}

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
