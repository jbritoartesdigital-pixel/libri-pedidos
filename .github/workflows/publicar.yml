name: Publicar Portal de Pedidos
# Release V128: quatro miniaturas originais e correcoes V127 acumuladas; gates completos.
# Release V127: exemplos visuais compactos e pergunta exclusiva do Atelie.
# Release V126: validacao no campo, fotos condicionais e declaracao no envio; gates completos.
# Release V125: paridade administrativa consolidada, briefing, area da cliente, contratos e ciclo seguro; gates completos.
# Release V124: galeria administrativa compartilhada V2/V3, fixture de contratos e gates completos.
# Release V123: painel lateral comum e funcoes restauradas na ficha V3; gates obrigatorios.
# Release V122: corrigir guard do ZIP modular e validar download real; gates obrigatorios.
# V121: revalidar teste de retrospectiva legada apos ajuste da mensagem de bloqueio.
# Release V121: PR #172; inicio direto e entrega sem previa obrigatoria; gates obrigatorios.
# Release V120: PR #171; ZIP modular e acesso direto a producao; gates obrigatorios.
# Release V119: PR #170; perguntas locais e aviso WhatsApp apos briefing; gates obrigatorios.
# Release V118: PR #169; autosave nao bloqueante, fila de rascunhos e testes de latencia; gates obrigatorios.
# Release V117: PR #168; perguntas dinamicas, paridade do briefing de convite e agenda interna; gates obrigatorios.
# Release V116: PR #167; area da cliente pos-pagamento, briefing guiado e resumo compacto; gates obrigatorios.
# Release V115: PR #166; compactacao dos carrinhos, filtro uniforme e Atelie opcional; gates obrigatorios.
# Release V114: PR #165; resumo administrativo, historico, premio Black e fila manual; sem campo e-mail no resumo; gates mantidos.
# Release V113: PR #164; edição manual direta, formato/cenas, adicionais visíveis e loading Studio; gates de produção obrigatórios.
# Release V112: PRs #162 e #163; nomes Studio, saudação, carrinho direto e adicionais opcionais; gates de produção mantidos.
# Release V110: PR #161; checkout manual compacto, seleção V2 e modal de adicionais; gates de produção obrigatórios, sem nova migration.
# Release V109: PR #160, CI 45513930500 aprovado; checkout manual, Black, datas e DDI; migration 0066, backup e gates mantidos.
# Release V107: PR #159, CI 45509768298 aprovado; capturas reais e cinco adicionais sem rolagem verificados no simulador 390x740. Gates mantidos.
# Release V106: PR #158, CI 45507064387 aprovado; cinco eventos em coluna, títulos grandes e capturas verificadas.
# Release V105: PR #157, CI 45505943872 aprovado; capturas mobile, noturna e desktop revisadas. Gates mantidos.
# Release V104: PR #155, CI 45501866296 aprovado, migration 0065 de descontos iniciais e ofertas contextuais; backup e gates mantidos.
# Release V103: PR #154, CI 45499207776 aprovado, capturas mobile e desktop revisadas; contraste corrigido. Gates mantidos.
# Release V99: PR #153, CI 45495138047 aprovado; identidade Studio, fluxo simplificado e ofertas manuais. Gates mantidos.
# Release V96: PR #152, CI 45488796377 aprovado; simulador isolado, refinamento da loja, Black e agenda. Gates mantidos.
# Release V93 (24/11/2026): linguagem visual do Admin aplicada à loja e Black Libri; preservar gates, campanha e regras comerciais.
# Release V92 (24/11/2026): transição leve do carrinho e seletor estável no teste legado; gates completos mantidos.
# Release V91 (24/11/2026): PR #151, CI 45480386817 aprovado. Migração 0063 aditiva, gates e backup D1 obrigatórios.
# Release V80 (24/11/2026): PR #150, composição unificada, carregamento escuro, tema noturno opcional. Testes de publicação obrigatórios.
# Release V76 (24/11/2026): PR #149, glass rosé, Manrope local, viewport fixo e modal de oferta; gate de testes obrigatório.
# Release 24/11/2026: PR #148, vidro escuro e consulta de data alternativa; CI 45466359300 aprovado.
# Release V75 (24/11/2026): refinamentos de compra, agenda automática e recuperação da surpresa; CI 45461720246 aprovado.
# Release 23/11: catálogo Ateliê V4.1 R$159/299/549, paleta, tipografia, 3/4/5 poses; Admin seguro, sem migrations.
# Release 23/11: figuras temáticas já previstas na composição não geram personagem extra; PR #140, sem migrations.
# Release 23/11: melhorias de briefing V4.1, irmãos, mascotinhos e fotos privadas; sem migrations.
# Release 23/11: Admin V3, filas por serviço e etapa artística, cache mobile; sem migrations.
# V3 23/11/2026: loja /loja + Ateliê com vendas bloqueadas até aprovação no Admin; /pedido preservado.
# Release V2 11/11: arte editorial e logo original Black Libri; cache revisado, sem migrations.
# Release Black Libri Rose Edition 11/11: baloes rose, som, resgate e consulta; sem migrations.
# Release 10/11: mostrar premiação Black Libri no detalhe administrativo; sem migrations.
# Publicações de manutenção com o marcador [sem-migracoes] não aplicam migrations D1.
# Limpeza de tabelas legadas exige bookmark Time Travel e contagens previamente auditadas.
# Release de interface 30/10: ações alinhadas e prévia administrativa aposentada, sem alterações D1.
# Release Black Libri 10/11: tabelas aditivas 0029-0031, painel de prêmios OFF por padrão.
# Esta linha é um marcador de release; nenhuma campanha é ativada pelo deploy.
# Correção 10/11: prévia de balões no simulador e consulta ao clicar em pagamento.
# Correção 10/11: balão em pedido manual e textos curtos para cliente; sem migrations.
# Correção 10/11: bônus duplicados convertidos em descontos, conferência do total antes do MP.
# Novo benefício Black Libri: 20% OFF raro, cadastro desativado por padrão; migration 0032.

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Aplicar migrations no banco de produção'
        type: boolean
        required: true
        default: true
      preflight_only:
        description: 'Somente verificar Cloudflare e os testes, sem publicar ou alterar o D1'
        type: boolean
        required: true
        default: true
  # Liberação única: alterações posteriores não fazem deploy por push,
  # a menos que o commit tenha explicitamente o prefixo de release abaixo.
  push:
    branches: [main]
    paths:
      - '.github/workflows/publicar.yml'

permissions:
  contents: read

concurrency:
  group: libri-pedidos-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release: libri-pedidos-finalizar-20261010') || startsWith(github.event.head_commit.message, 'release: libri-pedidos-v3-integral'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Proteger branch de produção
        run: |
          if [ "$GITHUB_REF" != 'refs/heads/main' ] && [ "$PREFLIGHT_ONLY" != 'true' ]; then
            echo '::error::A publicação deve partir da main. A pré-verificação pode usar a branch de trabalho.'
            exit 1
          fi
        env:
          PREFLIGHT_ONLY: ${{ inputs.preflight_only }}

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Exigir migrations para a primeira publicação V3
        if: ${{ !inputs.preflight_only }}
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs';const c=JSON.parse(readFileSync('wrangler.jsonc','utf8'));if(c.vars.LIBRI_V3_CHECKOUT_ENABLED==='true'&&(process.env.APPLY_MIGRATIONS==='false'||process.env.COMMIT_MESSAGE.includes('[sem-migracoes]')))throw Error('A publicação V3 exige migrations verificadas.');"
        env:
          APPLY_MIGRATIONS: ${{ inputs.apply_migrations }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Validar sintaxe JavaScript
        run: npm run check

      - name: Testar fluxos V2 em SQLite
        run: npm test

      # Gate obrigatório antes de acessar R2, D1 ou publicar o Worker.
      # Apenas dados sintéticos. Alterações visuais geram evidências, sem
      # bloquear por diferenças de pixels; falhas funcionais/mobile bloqueiam.
      - name: Preparar navegador de teste (uma instalação)
        run: |
          npm install --prefix /tmp/libri-browser-deps --no-save --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.58.2 pngjs@7.0.0
          ln -s /tmp/libri-browser-deps/node_modules/playwright node_modules/playwright
          ln -s /tmp/libri-browser-deps/node_modules/pngjs node_modules/pngjs
          /tmp/libri-browser-deps/node_modules/.bin/playwright install --with-deps chromium

      # Distinct coverage: legacy Android/diagnostic and actual integrated V3 journey.
      - name: Testar navegação V2 e V3 antes de publicar
        run: |
          node tests/etapa2-browser.mjs
          LIBRI_PLAYWRIGHT_MODULE=/tmp/libri-browser-deps/node_modules/playwright/index.mjs node tests/browser/v3-store.mjs

      - name: Guardar evidências dos navegadores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libri-browser-release-${{ github.run_id }}
          path: |
            artifacts/v3-browser/
            .artifacts/etapa2/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validar migrations e catálogo localmente
        run: python3 scripts/check-migrations.py

      - name: Confirmar acesso seguro ao Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Token Cloudflare não configurado"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Conta Cloudflare não configurada"; exit 1; }
          echo "✓ Credenciais Cloudflare disponíveis. Prosseguindo com validação remota."

      - name: Verificar pacote Cloudflare sem publicar
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/release-check
        env:
          WRANGLER_SEND_METRICS: 'false'

      - name: Conferir existência dos secrets de pagamentos (sem revelar valores)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler secret list --format json > /tmp/libri-secrets-names.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const secrets=JSON.parse(readFileSync('/tmp/libri-secrets-names.json','utf8'));
          if(!Array.isArray(secrets)||!['MERCADO_PAGO_ACCESS_TOKEN','MERCADO_PAGO_WEBHOOK_SECRET'].every(n=>secrets.some(x=>x.name===n)))throw Error('Secrets de pagamento não confirmados; publicação bloqueada.');
          console.log('Secrets de pagamento presentes; valores não consultados.');
          NODE
          rm -f /tmp/libri-secrets-names.json

      - name: Conferir bucket privado existente sem criar serviços
        run: |
          npx wrangler r2 bucket info libri-pedidos-files >/dev/null || {
            echo "::error::Bucket existente não encontrado; não criar novos recursos automaticamente."
            exit 1
          }
          echo "✓ Bucket existente conferido, sem criação de serviço."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Ver migrations pendentes no D1
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Registrar bookmark D1 antes de qualquer migration de produção
        if: ${{ !inputs.preflight_only && (github.event_name != 'workflow_dispatch' || inputs.apply_migrations) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[sem-migracoes]')) }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 time-travel info libri-pedidos-db --json > /tmp/d1-release-bookmark.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const info=JSON.parse(readFileSync('/tmp/d1-release-bookmark.json','utf8'));
          const bookmark=info.bookmark??info.result?.bookmark;
          if(!/^[a-zA-Z0-9_-]{12,120}$/.test(String(bookmark||'')))throw Error('Sem bookmark válido; migrations bloqueadas.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Ponto de recuperação D1\n\nBookmark: '+bookmark+'\n\nNão restaurar automaticamente: pedidos posteriores precisam ser preservados.\n');
          NODE
          rm -f /tmp/d1-release-bookmark.json

      - name: Criar backup do D1 antes das migrations
        if: ${{ !inputs.preflight_only && (github.event_name != 'workflow_dispatch' || inputs.apply_migrations) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[sem-migracoes]')) }}
        run: |
          npx wrangler d1 export libri-pedidos-db \
            --remote \
            --output=backup-d1-before-deploy.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Nunca anexar SQL de clientes em repositório público.
      # Se houver segredo de backup opcional, anexar SOMENTE versão cifrada.
      - name: Cifrar backup com AES-256 quando chave estiver disponível
        if: ${{ !inputs.preflight_only && (github.event_name != 'workflow_dispatch' || inputs.apply_migrations) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[sem-migracoes]')) }}
        id: d1_backup
        env:
          BACKUP_PASSWORD: ${{ secrets.LIBRI_D1_BACKUP_PASSWORD }}
        run: |
          if [ -n "$BACKUP_PASSWORD" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt \
              -in backup-d1-before-deploy.sql \
              -out backup-d1-before-deploy.sql.enc \
              -pass env:BACKUP_PASSWORD
            echo "encrypted=true" >> "$GITHUB_OUTPUT"
            echo "✓ Backup cifrado; somente o .enc pode ser armazenado."
          else
            echo "encrypted=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem senha de cifragem: backup local temporário, sem anexo público."
          fi
          rm -f backup-d1-before-deploy.sql

      - name: Guardar somente backup cifrado
        if: ${{ !inputs.preflight_only && steps.d1_backup.outputs.encrypted == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-encriptado-${{ github.run_id }}
          path: backup-d1-before-deploy.sql.enc
          retention-days: 14
          if-no-files-found: error

      - name: Registrar ponto de restauracao D1 e validar tabela a tabela antes de apagar
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[limpeza-d1-flow-drive]') }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 time-travel info libri-pedidos-db --json > /tmp/d1-pre-cleanup-bookmark.json
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const info=JSON.parse(readFileSync('/tmp/d1-pre-cleanup-bookmark.json','utf8'));
          const bookmark=info.bookmark??info.result?.bookmark;
          if(!/^[a-zA-Z0-9_-]{12,120}$/.test(String(bookmark||'')))throw Error('Sem bookmark: excluir tabelas bloqueado.');
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## D1: ponto de recuperação antes da limpeza\\n\\n'+
            'Bookmark: \`'+bookmark+'\`\\n\\nRestauração exige revisão para não desfazer pedidos novos.\\n');
          console.log('Ponto de recuperação D1 conferido e registrado no resumo da execução.');
          NODE
          pnpm exec wrangler d1 execute libri-pedidos-db --remote --json --command "SELECT (SELECT COUNT(*) FROM v2_order_drive_folders) AS n0, (SELECT COUNT(*) FROM v2_drive_oauth_state) AS n1, (SELECT COUNT(*) FROM v2_drive_oauth_connection) AS n2, (SELECT COUNT(*) FROM v2_drive_uploaded_previews) AS n3, (SELECT COUNT(*) FROM v2_drive_sync_settings) AS n4, (SELECT COUNT(*) FROM v2_drive_sync_attempts) AS n5, (SELECT COUNT(*) FROM v2_flow_device_grants) AS n6, (SELECT COUNT(*) FROM v2_flow_publication_links) AS n7, (SELECT COUNT(*) FROM v2_flow_drive_uploads) AS n8" > /tmp/d1-pre-cleanup-counts.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const counts=JSON.parse(readFileSync('/tmp/d1-pre-cleanup-counts.json','utf8'))?.[0]?.results?.[0];
          const maximums=[1,0,1,0,1,0,3,0,0];
          if(!counts)throw Error('Contagens indisponíveis, limpeza bloqueada.');
          for(let i=0;i<maximums.length;i++){
            const count=counts['n'+i];
            if(!Number.isSafeInteger(count)||count<0||count>maximums[i])
              throw Error('Tabela n'+i+' mudou desde a auditoria; limpeza bloqueada.');
          }
          console.log('As nove tabelas permaneceram dentro das contagens auditadas. Migração autorizada.');
          NODE

      - name: Aplicar migrations no D1
        if: ${{ !inputs.preflight_only && (github.event_name != 'workflow_dispatch' || inputs.apply_migrations) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[sem-migracoes]')) }}
        run: npx wrangler d1 migrations apply libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir migrations após aplicação
        if: ${{ !inputs.preflight_only && (github.event_name != 'workflow_dispatch' || inputs.apply_migrations) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[sem-migracoes]')) }}
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Liberar catálogo V3 aprovado somente na publicação integral
        if: ${{ !inputs.preflight_only }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if node --input-type=module -e "import {readFileSync} from 'node:fs';process.exit(JSON.parse(readFileSync('wrangler.jsonc','utf8')).vars.LIBRI_V3_CHECKOUT_ENABLED==='true'?0:1)"; then
            node scripts/v3-release-catalog.mjs --apply
          else
            echo 'Checkout V3 desabilitado na configuração; não liberar pacotes.'
          fi

      # Os secrets já configurados no Worker são preservados pelo deploy.
      # Não os regravamos aqui para não alterar sessão Admin, Passkey, Push ou Mercado Pago.

      - name: Publicar Worker
        if: ${{ !inputs.preflight_only }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verificar loja V3 publicada sem criar pedidos ou cobranças
        if: ${{ !inputs.preflight_only }}
        run: node scripts/v3-release-smoke.mjs

      - name: Verificar status público Black Libri sem usar dados de clientes
        if: ${{ !inputs.preflight_only }}
        continue-on-error: true
        run: |
          node --input-type=module <<'NODE'
          const url='https://pedidos.libriconvites.com.br/api/v2/black-libri/info';
          const response=await fetch(url,{headers:{'cache-control':'no-cache'},signal:AbortSignal.timeout(15000)});
          if(!response.ok)throw Error('Status HTTP '+response.status);
          const body=await response.json();
          if(typeof body.enabled!=='boolean')throw Error('Resposta de ativação não reconhecida');
          console.log('Estado público da Black Libri: '+(body.enabled?'ATIVA':'INATIVA'));
          NODE

      - name: Registrar resultado da pré-verificação
        if: ${{ inputs.preflight_only }}
        run: echo 'Pré-verificação concluída. Nenhum deploy, backup/export, migration ou ativação comercial foi executado.' >> "$GITHUB_STEP_SUMMARY"

      - name: Excluir cópias temporárias do backup
        if: always()
        run: rm -f backup-d1-before-deploy.sql backup-d1-before-deploy.sql.enc

