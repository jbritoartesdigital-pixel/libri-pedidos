name: Publicar Portal de Pedidos

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Instalar dependências
        run: npm install

      - name: Validar sintaxe JavaScript
        run: |
          find src public/js -type f \( -name "*.js" -o -name "*.mjs" \) -print0 \
            | xargs -0 -n1 node --check

      - name: Validar migrations e catálogo V2 localmente
        run: |
          python3 <<'PY'
          from pathlib import Path
          import sqlite3

          migration_files = sorted(Path("migrations").glob("*.sql"))

          if not migration_files:
              raise SystemExit("Nenhuma migration encontrada.")

          db = sqlite3.connect(":memory:")

          try:
              for migration in migration_files:
                  print(f"Aplicando localmente: {migration.name}")
                  db.executescript(migration.read_text(encoding="utf-8"))

              products = db.execute(
                  "SELECT COUNT(*) FROM v2_products"
              ).fetchone()[0]

              if products != 7:
                  raise SystemExit(
                      f"Catálogo V2 inválido: esperados 7 produtos, encontrados {products}."
                  )

              terms = db.execute(
                  "SELECT COUNT(*) FROM v2_terms_versions "
                  "WHERE version = '2.0' AND active = 1"
              ).fetchone()[0]

              if terms != 1:
                  raise SystemExit("Termos 2.0 ativos não encontrados.")

              expected = {
                  "cinematic_video_1": 4000,
                  "cinematic_video_2": 5500,
                  "cinematic_video_3": 7000,
                  "cinematic_video_4": 8500,
                  "cinematic_video_5": 11000,
                  "cinematic_video_6": 13500,
                  "cinematic_video_7": 16000,
                  "cinematic_video_8": 18500,
                  "cinematic_interactive_1": 5500,
                  "cinematic_interactive_2": 7500,
                  "cinematic_interactive_3": 10000,
                  "cinematic_interactive_4": 12500,
                  "cinematic_interactive_5": 15500,
                  "cinematic_interactive_6": 19000,
                  "cinematic_interactive_7": 22000,
                  "cinematic_interactive_8": 25000,
                  "interactive_essential_default": 3500,
                  "interactive_animated_default": 6500,
                  "interactive_gif_default": 5500,
                  "book_default": 15000,
                  "infinite_default": 8500,
              }

              actual = dict(
                  db.execute(
                      "SELECT code, price_cents FROM v2_product_variants"
                  ).fetchall()
              )

              for code, price in expected.items():
                  if actual.get(code) != price:
                      raise SystemExit(
                          f"Preço V2 inválido em {code}: "
                          f"esperado {price}, encontrado {actual.get(code)}."
                      )

              settings = dict(
                  db.execute(
                      "SELECT key, value FROM v2_settings"
                  ).fetchall()
              )

              required_settings = {
                  "default_sellable_points_per_day_units": "400",
                  "default_internal_buffer_points_per_day_units": "100",
                  "recommended_delivery_days_before_event": "40",
                  "urgency_percent": "30",
                  "pix_deposit_percent": "50",
                  "preview_expiry_hours": "24",
              }

              for key, value in required_settings.items():
                  if settings.get(key) != value:
                      raise SystemExit(
                          f"Configuração V2 inválida em {key}: "
                          f"esperado {value}, encontrado {settings.get(key)}."
                      )

              print("✓ Migrations, catálogo V2, preços, Points Libri e Termos 2.0 validados.")
          finally:
              db.close()
          PY

      - name: Ver migrations pendentes no D1
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Criar backup do D1 antes das migrations
        run: |
          npx wrangler d1 export libri-pedidos-db \
            --remote \
            --output=backup-d1-before-deploy.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Guardar backup do D1
        uses: actions/upload-artifact@v4
        with:
          name: backup-d1-before-deploy
          path: backup-d1-before-deploy.sql
          retention-days: 14

      - name: Aplicar migrations no D1
        run: npx wrangler d1 migrations apply libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Conferir migrations após aplicação
        run: npx wrangler d1 migrations list libri-pedidos-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Publicar Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
