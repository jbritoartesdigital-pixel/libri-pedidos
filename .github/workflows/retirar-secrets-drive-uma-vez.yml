name: Retirar credenciais aposentadas do Drive (uma vez)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/retirar-secrets-drive-uma-vez.yml']
permissions:
  contents: read
concurrency:
  group: libri-pedidos-production
  cancel-in-progress: false
jobs:
  cleanup:
    if: ${{ github.event.head_commit.message == 'chore: remover somente secrets Google Drive desativados' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Retirar somente 3 segredos Google Drive do Worker Pedidos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          printf '%s' '{"GOOGLE_DRIVE_CLIENT_ID":null,"GOOGLE_DRIVE_CLIENT_SECRET":null,"GOOGLE_DRIVE_ENCRYPTION_KEY":null}' | pnpm exec wrangler secret bulk --name libri-pedidos
          echo 'Foram removidas somente as credenciais do Google Drive do Worker Libri Pedidos.' >> "$GITHUB_STEP_SUMMARY"
