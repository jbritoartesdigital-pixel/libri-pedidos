name: Verificar restauracao D1 (somente leitura)
on:
  push:
    branches: [chore/aposentar-tabelas-flow-drive-20261030]
    paths: ['.github/workflows/teste-temporario-d1-recovery.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: 24}
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Verificar sistema D1 e bookmark sem alterar a produção
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 time-travel info libri-pedidos-db --json > /tmp/d1-bookmark.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/d1-bookmark.json','utf8'));
          const b=x.bookmark??x.result?.bookmark;
          if(!/^[a-zA-Z0-9_-]{12,120}$/.test(String(b||'')))throw Error('Bookmark não encontrado.');
          console.log('Time Travel: disponível; bookmark válido');
          NODE
