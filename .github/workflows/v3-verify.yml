name: V3 | Verificar antes de publicar
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Checar V2 + V3 sem deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Conferir sintaxe e imports
        run: npm run check
      - name: Testes automatizados
        run: npm test
      - name: Validar migrations em SQLite (sem produção)
        run: |
          python3 - <<'PY'
          import pathlib,sqlite3
          db=sqlite3.connect(':memory:')
          for path in sorted(pathlib.Path('migrations').glob('*.sql')):
              print('Validando',path.name)
              db.executescript(path.read_text())
          print('Tabelas:',db.execute("SELECT count(*) FROM sqlite_master WHERE type='table'").fetchone()[0])
          assert db.execute("SELECT count(*) FROM v2_products").fetchone()[0]==7
          assert db.execute("SELECT count(*) FROM v3_atelie_packages").fetchone()[0]==3
          print('Migrações e catálogo V2 consistentes')
          PY
      - name: Navegação real Chromium (banco de teste, sem pagamentos)
        run: |
          npm install --prefix "$RUNNER_TEMP/libri-browser" --no-save --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/libri-browser/node_modules/.bin/playwright" install --with-deps chromium
          LIBRI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/libri-browser/node_modules/playwright/index.mjs" node tests/browser/v3-store.mjs
      - name: Capturas de navegador do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libri-v3-browser
          path: artifacts/v3-browser/
          if-no-files-found: ignore
          retention-days: 7
