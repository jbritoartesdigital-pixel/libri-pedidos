name: V3 | Verificar antes de publicar
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: libri-v3-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Checar V2 + V3 sem deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Conferir sintaxe e imports
        run: npm run check
      - name: Testes automatizados
        run: npm test
      - name: Validar migrations em SQLite (sem produção)
        run: python3 scripts/check-migrations.py
      - name: Navegação real Chromium (banco de teste, sem pagamentos)
        run: |
          npm install --prefix "$RUNNER_TEMP/libri-browser" --no-save --no-audit --no-fund playwright@1.58.2
          "$RUNNER_TEMP/libri-browser/node_modules/.bin/playwright" install --with-deps chromium
          LIBRI_PLAYWRIGHT_MODULE="$RUNNER_TEMP/libri-browser/node_modules/playwright/index.mjs" node tests/browser/v3-store.mjs
      - name: Capturas de navegador do teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libri-v3-browser
          path: artifacts/v3-browser/
          if-no-files-found: ignore
          retention-days: 7

  security-audit:
    name: Auditoria de dependências e histórico (sem deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Auditoria de dependências (sem alterar lockfile)
        run: pnpm audit --audit-level high
      - name: Verificar segredos no histórico Git (saída redigida)
        if: always()
        run: |
          out="$(mktemp -d)"
          rc=0
          docker run --rm -v "$PWD:/repo:ro" -v "$out:/out" ghcr.io/gitleaks/gitleaks:v8.24.3 git /repo --redact=100 --no-banner --log-opts="--all" --report-format=json --report-path=/out/report.json || rc=$?
          if [ -f "$out/report.json" ]; then
            node -e 'const fs=require("fs");const a=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const x of a||[])console.log(JSON.stringify({rule:x.RuleID,file:x.File,line:x.StartLine,commit:x.Commit}));' "$out/report.json"
          fi
          rm -rf "$out"
          exit "$rc"
  security-regressions:
    name: Testes específicos de segurança (sem deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/security-hardening.test.mjs

  dependency-candidate:
    name: Verificar atualização candidata do Wrangler (sem deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - name: Gerar lockfile candidato em ambiente descartável
        run: pnpm update wrangler --latest --lockfile-only
      - name: Verificar vulnerabilidades da candidata
        run: pnpm audit --audit-level high
      - name: Conferir instalação e sintaxe
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
      - name: Disponibilizar somente manifesto e lockfile gerados
        run: |
          node -e 'const fs=require("fs");for(const f of ["package.json","pnpm-lock.yaml"]){const b=fs.readFileSync(f).toString("base64");for(let i=0;i<b.length;i+=2000)console.log("SEC_CANDIDATE "+f+" "+b.slice(i,i+2000));}'
