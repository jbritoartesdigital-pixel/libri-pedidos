name: Verificar limpeza final de integracoes aposentadas
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validar-limpeza-drive-flow-uma-vez.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Confirmar ausencia de tabelas e segredos, sem ler dados pessoais
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          pnpm exec wrangler d1 execute libri-pedidos-db --remote --json --command "SELECT name FROM sqlite_master WHERE type='table' AND (name LIKE 'v2_%drive%' OR name LIKE 'v2_%flow%') ORDER BY name" > /tmp/old-tables.json
          pnpm exec wrangler secret list --name libri-pedidos > /tmp/worker-secrets.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const tables=JSON.parse(readFileSync('/tmp/old-tables.json','utf8'))?.[0]?.results;
          if(!Array.isArray(tables))throw Error('Resultado de consulta D1 invalido');
          const secrets=JSON.parse(readFileSync('/tmp/worker-secrets.json','utf8'));
          if(!Array.isArray(secrets))throw Error('Lista de segredos invalida');
          const old=['GOOGLE_DRIVE_CLIENT_ID','GOOGLE_DRIVE_CLIENT_SECRET','GOOGLE_DRIVE_ENCRYPTION_KEY'];
          if(tables.length)throw Error('Persistem tabelas antigas: '+tables.map(x=>x.name).join(','));
          if(old.some(name=>secrets.some(s=>s.name===name)))throw Error('Persistem segredos da integracao Google Drive.');
          console.log('Sucesso: sem tabelas antigas Flow/Drive e sem as 3 credenciais Google Drive.');
          NODE
