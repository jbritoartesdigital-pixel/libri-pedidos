name: Validar Libri Pedidos V2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - name: Validar bundle sem publicar
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/validation
        env:
          WRANGLER_SEND_METRICS: 'false'
