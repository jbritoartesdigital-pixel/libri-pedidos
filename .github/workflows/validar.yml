name: Validar Libri Pedidos V2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Diagnosticar tela branca do admin publicado
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://pedidos.libriconvites.com.br';
          for (const route of [
            '/admin-v2',
            '/admin-v2.html',
            '/css/admin-v2.css?v=20261009-admin-quickfinish-1',
            '/js/admin-v2.js?v=20261009-admin-quickfinish-1',
            '/js/admin-v2-core.js',
            '/js/admin-v2-diagnostics.js',
            '/js/admin-v2-order.js?v=20261009-admin-quickfinish-1',
            '/js/admin-v2-finance.js?v=20261009-admin-quickfinish-1',
            '/api/admin/v2/auth/session',
          ]) {
            try {
              const response = await fetch(base + route, {signal: AbortSignal.timeout(14000)});
              const body = await response.text();
              console.log(JSON.stringify({
                route, status: response.status,
                contentType: response.headers.get('content-type'),
                size: body.length, sample: body.slice(0, 120),
              }));
            } catch(error) { console.log(JSON.stringify({route,error:String(error)})); }
          }
          NODE
      - run: pnpm run check
      - run: pnpm test
      - name: Validar bundle sem publicar
        run: pnpm exec wrangler deploy --dry-run --outdir .wrangler/validation
        env:
          WRANGLER_SEND_METRICS: 'false'
