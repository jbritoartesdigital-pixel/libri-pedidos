<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#f7f3f1">
  <title>Libri Gestão | Pedidos e serviços</title>
  <link rel="manifest" href="/admin-manifest-v2.webmanifest">
  <script src="/js/admin-theme.js?v=81"></script>
  <link rel="preload" href="/fonts/manrope-variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/css/admin-v2.css?v=20261124-admin-v3-88-mobile1">
</head>
<body>
  <div id="authGate" class="auth-gate hidden" aria-live="polite"></div>

  <div id="adminApp" class="admin-app hidden">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-mark" src="/images/libri-emblem.png" width="44" height="44" alt="">
        <div>
          <strong>Libri Convites</strong>
          <small>Painel de Gestão</small>
        </div>
      </div>

      <button id="adminRailToggle" class="rail-toggle" type="button" aria-pressed="false" aria-label="Recolher menu" title="Recolher menu"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16m7-11-3 3 3 3"/></svg></button>
      <nav class="nav" aria-label="Navegação do Admin">
        <span class="nav-group-label">Seu trabalho</span>
        <div class="nav-primary">
          <button type="button" data-view="central" class="nav-btn active" aria-label="Central" title="Central"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="3" y="14" width="8" height="7" rx="2"/><rect x="14" y="11" width="7" height="10" rx="2"/></svg><span class="nav-label">Central</span></button>
          <button type="button" data-view="orders" class="nav-btn" aria-label="Pedidos" title="Pedidos"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l3 3v15H4V3h3zM8 10h8M8 14h8M8 18h5"/></svg><span class="nav-label">Pedidos</span></button>
          <button type="button" data-view="production" class="nav-btn" aria-label="Produção" title="Produção"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h16"/><circle cx="8" cy="5" r="2" fill="currentColor"/><circle cx="15" cy="12" r="2" fill="currentColor"/><circle cx="10" cy="19" r="2" fill="currentColor"/></svg><span class="nav-label">Produção</span></button>
          <button type="button" data-view="agenda" class="nav-btn" aria-label="Agenda" title="Agenda"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18m-13 5h2m4 0h2"/></svg><span class="nav-label">Agenda</span></button>
          <button type="button" data-view="finance" class="nav-btn" aria-label="Financeiro" title="Financeiro"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18m-13 5h3"/><circle cx="17" cy="15" r="1"/></svg><span class="nav-label">Financeiro</span></button>
          <button type="button" data-view="store" class="nav-btn" aria-label="Loja" title="Loja"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9l2-5h12l2 5v3a3 3 0 0 1-3 3 3 3 0 0 1-5-1 3 3 0 0 1-5 1 3 3 0 0 1-3-3zM6 15v6h12v-6"/></svg><span class="nav-label">Loja</span></button>
        </div>
        <button type="button" data-view="manual" class="nav-btn nav-btn-create" aria-label="Novo pedido" title="Novo pedido"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="nav-label">Novo pedido</span></button>
        <details class="nav-more" id="adminMoreMenu">
          <summary>Mais opções <span aria-hidden="true">⌄</span></summary>
          <div class="nav-secondary">
            <button type="button" data-view="archived" class="nav-btn">Arquivados</button>
            <button type="button" data-view="notifications" class="nav-btn">Notificações</button>
            <button type="button" data-view="security" class="nav-btn">Segurança</button>
            <button id="showAdminDiagnostic" type="button" class="nav-btn nav-utility" aria-label="Ver diagnóstico técnico" aria-haspopup="dialog">Diagnóstico técnico</button>
            <button id="logoutBtn" class="nav-btn nav-utility" type="button">Sair da conta</button>
          </div>
        </details>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <span id="viewEyebrow" class="eyebrow">Hoje</span>
          <h1 id="viewTitle">Central</h1>
        </div>

        <div class="top-actions">
          <button id="adminThemeToggle" class="icon-btn admin-theme-toggle" type="button" aria-label="Ativar modo noturno" aria-pressed="false" title="Ativar modo noturno" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15.1A8.5 8.5 0 0 1 8.9 4a8.5 8.5 0 1 0 11.1 11.1Z"/></svg></button>
          <button id="notificationBell" class="icon-btn" type="button" aria-label="Notificações">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9a6 6 0 0 0-12 0c0 6-3 6-3 8h18c0-2-3-2-3-8m-8 11h4"/></svg>
            <span id="bellCount" class="bell-count hidden">0</span>
          </button>

          <button id="findAdminFeature" class="btn btn-secondary feature-find-trigger"
            type="button" aria-expanded="false" aria-controls="featureFinder">
            <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><span>Buscar</span><kbd>Ctrl K</kbd>
          </button>

          <button id="refreshBtn" class="btn btn-ghost" type="button">
            Atualizar
          </button>
        </div>
      </header>

      <section id="featureFinder" class="feature-finder hidden" aria-label="Encontrar função"></section>

      <nav id="adminPinned" class="admin-pinned" aria-label="Meus atalhos"></nav>
      <section id="viewRoot" class="view-root"></section>
    </main>
  </div>

  <div id="modalRoot" class="modal-root hidden" aria-hidden="true"></div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script defer src="/js/admin-v2-boot-watchdog.js?v=20261010-admin-recovery-1"></script>
  <script type="module" src="/js/admin-v2.js?v=20261124-v95"></script>
</body>
</html>
