<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
  <meta name="theme-color" content="#183f68">
  <title>Helena 5 anos • Interativo Animado</title>
  <meta name="description" content="Demonstração Libri Convites • Helena 5 anos">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Helena 5 anos • Interativo Animado">
  <meta property="og:description" content="Demonstração Libri Convites • Helena 5 anos">
  <meta property="og:url" content="https://pedidos.libriconvites.com.br/demos/frozen-interativo-animado/">
  <meta property="og:image" content="https://pedidos.libriconvites.com.br/demos/frozen-interativo-animado/imagens/preview-otimizada.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Helena 5 anos • Interativo Animado">
  <meta name="twitter:description" content="Demonstração Libri Convites • Helena 5 anos">
  <meta name="twitter:image" content="https://pedidos.libriconvites.com.br/demos/frozen-interativo-animado/imagens/preview-otimizada.jpg">
  <style>
    :root{--bg:#061321;--surface:rgba(232,246,255,.96);--text:#173757;--accent:#91d7ff}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Arial,Helvetica,sans-serif}
    body{position:fixed;inset:0;user-select:none;-webkit-user-select:none}
    .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
    .stage{position:relative;width:max(100vw,calc(100vh * 9 / 16));height:max(100vh,calc(100vw * 16 / 9));overflow:hidden;background:#071625}
    @supports(height:100dvh){.stage{width:max(100vw,calc(100dvh * 9 / 16));height:max(100dvh,calc(100vw * 16 / 9))}}
    .media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    #final,#video,#cover{transition:opacity .22s ease}
    #video{opacity:0;visibility:hidden;background:#000}
    #video.active{opacity:1;visibility:visible}
    #cover{z-index:30}
    #cover.hide{opacity:0;pointer-events:none}
    #tap{position:absolute;inset:0;z-index:40;border:0;background:transparent;cursor:pointer}
    .hotspot{position:absolute;z-index:50;border:0;background:transparent;padding:0;cursor:pointer;display:none}
    .hotspot.active{display:block}
    #skip{position:fixed;right:max(14px,calc(env(safe-area-inset-right) + 14px));bottom:max(18px,calc(env(safe-area-inset-bottom) + 18px));z-index:80;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(0,0,0,.5);color:#fff;padding:9px 13px;font-size:13px;backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .16s ease}
    #skip.show{opacity:1;visibility:visible}
    .modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:24px;background:rgba(3,16,30,.62);backdrop-filter:blur(8px)}
    .modal.open{display:grid}
    .card{position:relative;width:min(92vw,430px);border:1px solid rgba(255,255,255,.72);border-radius:26px;padding:28px 24px 24px;background:linear-gradient(180deg,rgba(247,252,255,.98),rgba(221,241,255,.97));box-shadow:0 24px 70px rgba(0,0,0,.38);color:var(--text);text-align:center}
    .card h2{margin:0 0 10px;font-family:Georgia,serif;font-size:27px}
    .card p{margin:0;line-height:1.55;font-size:15px}
    .card small{display:block;margin-top:14px;opacity:.7;line-height:1.45}
    .close{position:absolute;right:12px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:rgba(23,55,87,.08);color:var(--text);font-size:24px;cursor:pointer}
    .loading{position:fixed;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);z-index:90;border-radius:999px;padding:8px 12px;background:rgba(0,0,0,.48);color:#fff;font-size:12px;opacity:0;transition:opacity .16s ease;pointer-events:none}
    .loading.show{opacity:1}
  </style>
</head>
<body>
  <main class="screen">
    <div class="stage" id="stage">
      <img id="final" class="media" alt="">
      <video id="video" class="media" playsinline preload="auto"></video>
      <img id="cover" class="media" alt="">
      <button id="tap" aria-label="Abrir convite"></button>
      <button class="hotspot" data-action="confirmacao" aria-label="Confirmar presença"></button>
      <button class="hotspot" data-action="localizacao" aria-label="Localização"></button>
      <button class="hotspot" data-action="presentes" aria-label="Presentes"></button>
    </div>
  </main>
  <button id="skip" type="button">Pular abertura</button>
  <div id="loading" class="loading">Carregando…</div>

  <div id="modal" class="modal" role="dialog" aria-modal="true">
    <div class="card">
      <button id="close" class="close" type="button" aria-label="Fechar">×</button>
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <small>Esta é uma demonstração. No convite da cliente, cada botão é configurado com os dados reais do evento.</small>
    </div>
  </div>

  <script>
  (async () => {
    const cfg = await fetch('./config.json', {cache:'no-store'}).then(r => {
      if (!r.ok) throw new Error('config');
      return r.json();
    });

    const finalImg = document.getElementById('final');
    const cover = document.getElementById('cover');
    const video = document.getElementById('video');
    const tap = document.getElementById('tap');
    const skip = document.getElementById('skip');
    const loading = document.getElementById('loading');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalText = document.getElementById('modalText');
    const close = document.getElementById('close');
    const hotspots = [...document.querySelectorAll('.hotspot')];

    const pos = (el, p) => {
      el.style.left=p.left; el.style.top=p.top; el.style.width=p.width; el.style.height=p.height;
    };
    hotspots.forEach(el => pos(el, cfg.hotspots[el.dataset.action]));

    const activateHotspots = on => hotspots.forEach(el => el.classList.toggle('active', on));
    const showLoading = on => loading.classList.toggle('show', on);

    const openModal = action => {
      const data = cfg.modals[action];
      if (!data) return;
      modalTitle.textContent = data.title;
      modalText.textContent = data.text;
      modal.classList.add('open');
    };
    const closeModal = () => modal.classList.remove('open');

    hotspots.forEach(el => el.addEventListener('click', () => openModal(el.dataset.action)));
    close.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

    const waitFrame = () => new Promise(resolve => {
      let done=false;
      const end=()=>{ if(done)return; done=true; resolve(); };
      const timer=setTimeout(end,2200);
      if ('requestVideoFrameCallback' in video) video.requestVideoFrameCallback(()=>{clearTimeout(timer);end();});
      else video.addEventListener('loadeddata',()=>{clearTimeout(timer);end();},{once:true});
    });

    const hideCover = () => {
      cover.classList.add('hide');
      setTimeout(()=>cover.style.visibility='hidden',240);
    };

    const showFinal = () => {
      video.pause();
      video.classList.remove('active');
      video.style.visibility='hidden';
      finalImg.style.visibility='visible';
      finalImg.style.opacity='1';
      skip.classList.remove('show');
      activateHotspots(true);
    };

    if (cfg.mode === 'essential') {
      cover.style.display='none';
      tap.style.display='none';
      video.style.display='none';
      finalImg.src=cfg.assets.final;
      activateHotspots(true);
      return;
    }

    cover.src=cfg.assets.cover;
    finalImg.src=cfg.assets.final || cfg.assets.cover;
    video.src=cfg.mode === 'gif' ? cfg.assets.loop : cfg.assets.opening;
    video.loop = cfg.mode === 'gif';
    video.muted = cfg.mode === 'gif';

    tap.addEventListener('click', async () => {
      tap.style.display='none';
      showLoading(true);
      const frame=waitFrame();
      try {
        video.currentTime=0;
        video.classList.add('active');
        video.style.visibility='visible';
        await video.play();
        await frame;
        hideCover();
        showLoading(false);

        if (cfg.mode === 'gif') {
          finalImg.style.visibility='hidden';
          activateHotspots(true);
          return;
        }

        skip.classList.add('show');
        setTimeout(()=>skip.classList.remove('show'), Number(cfg.skipMs || 7000));
      } catch (_) {
        showLoading(false);
        hideCover();
        showFinal();
      }
    });

    if (cfg.mode === 'animated') {
      video.addEventListener('ended', showFinal);
      skip.addEventListener('click', showFinal);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (!video.paused) video.pause(); return; }
      if (cfg.mode === 'gif' && cover.classList.contains('hide')) video.play().catch(()=>{});
    });
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
  })().catch(() => {
    document.body.innerHTML='<div style="min-height:100dvh;display:grid;place-items:center;background:#071625;color:white;font:16px Arial;padding:24px;text-align:center">A demonstração ainda está recebendo as mídias finais.</div>';
  });
  </script>
</body>
</html>
