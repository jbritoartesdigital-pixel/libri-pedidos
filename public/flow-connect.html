<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><title>Libri Flow | Conectar celular</title>
<style>*,*:before,*:after{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4efe9;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;color:#3d2d32;padding:22px}.panel{width:min(100%,480px);background:white;border:1px solid #e9dbe0;border-radius:24px;padding:32px;box-shadow:0 16px 50px #3b243014}.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:750;color:#956a76}h1{font:600 30px/1.15 Georgia,serif;margin:15px 0}p{margin:12px 0;color:#67575a}button{display:block;width:100%;padding:16px 18px;margin-top:16px;border:0;border-radius:13px;color:#fff;background:#543740;font-size:16px;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:#6e4052}.secondary{background:#f4ecef;color:#543740}.small{font-size:13px}#status{min-height:45px}code{word-break:break-all}</style></head>
<body><main class="panel">
<div class="eyebrow">✦ LIBRI CONVITES</div><h1>Conectar seu celular</h1>
<p>Autorize o Libri Flow com a digital usada no Libri Pedidos. Nenhum pedido será modificado.</p>
<p id="status" role="status" aria-live="polite">Verificando sua autorização…</p>
<button id="login" type="button" class="secondary" hidden>Abrir Libri Pedidos para entrar com digital</button>
<button id="grant" type="button" disabled>Autorizar este celular</button>
<p class="small">Válido uma única vez por 90 segundos. Confirme somente se iniciou esta conexão pelo aplicativo Libri Flow.</p>
</main>
<script>
'use strict';
const nonce=new URL(location.href).searchParams.get('nonce')||'';
const status=document.querySelector('#status'),login=document.querySelector('#login'),grant=document.querySelector('#grant');
const valid=/^[a-f0-9]{64}$/.test(nonce);
history.replaceState(null,'','/flow-connect');
let authenticated=false;
function show(message){status.textContent=message;}
async function verify(){
 if(!valid){show('Conexão inválida. Inicie novamente no aplicativo.');return;}
 try{
  const r=await fetch('/api/admin/v2/auth/status',{credentials:'same-origin',cache:'no-store'});
  const body=await r.json();authenticated=r.ok&&body?.auth?.authenticated===true;
  login.hidden=authenticated;grant.disabled=!authenticated;
  show(authenticated?'Digital confirmada. Toque para autorizar o celular.':'Entre com a digital no Pedidos e volte a esta página.');
 }catch{show('Não foi possível verificar a sessão. Confira sua conexão.');grant.disabled=true;}
}
login.addEventListener('click',()=>{
 const w=window.open('/admin-v2','_blank','noopener,noreferrer');
 if(!w)show('Abra pedidos.libriconvites.com.br/admin-v2 em outra aba e volte aqui.');
});
window.addEventListener('focus',()=>verify());
grant.addEventListener('click',async()=>{
 if(!valid||!authenticated)return;
 grant.disabled=true;show('Autorizando dispositivo…');
 try{
  const r=await fetch('/api/admin/v2/flow/grants',{method:'POST',credentials:'same-origin',cache:'no-store',
   headers:{'content-type':'application/json'},body:JSON.stringify({nonce,label:'Libri Flow Android'})});
  const data=await r.json();
  if(!r.ok||!/^flg_[a-f0-9]{36}$/.test(data?.grant||''))throw Error('Autorização não concedida. Entre com a digital novamente.');
  show('Abra o Libri Flow para concluir a conexão.');
  location.href='libri-flow://connect?grant='+encodeURIComponent(data.grant);
 }catch(e){show(e.message||'Erro ao autorizar.');grant.disabled=false;}
});
verify();
</script></body></html>
